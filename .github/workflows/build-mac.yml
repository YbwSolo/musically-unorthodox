name: Build macOS plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: brew install cmake ninja || true

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DMU_BUILD_TESTS=ON -DMU_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release --target MusicallyUnorthodox_AU MusicallyUnorthodox_VST3 MusicallyUnorthodox_Standalone MUTests MUTutorCheck -- -quiet

      - name: DSP tests
        run: ./build/Release/MUTests

      - name: AU validation
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Muxa Muno

      - name: Build AI tutor pack
        run: bash scripts/make_tutor_pack.sh

      - name: Build installer
        run: bash scripts/make_installer.sh build/MusicallyUnorthodox_artefacts/Release "${GITHUB_RUN_NUMBER}"

      # Proves the tutor on a real Mac before anything is published: installs it from the feed just written,
      # starts the helper and asks questions with both real models. The models are kept between builds.
      - name: Keep the tutor models between builds
        uses: actions/cache@v4
        with:
          path: tutor-check
          key: tutor-models-${{ hashFiles('scripts/make_installer.sh', 'scripts/make_tutor_pack.sh') }}
          restore-keys: tutor-models-

      - name: AI tutor check (lighter model)
        env:
          MU_TUTOR_DIR: ${{ github.workspace }}/tutor-check/light
          MU_TUTOR_MODEL: light
          MU_TUTOR_ARGS: "--device none"
        run: |
          BIN="$(find build -type f -name MUTutorCheck -perm +111 | head -1)"
          "$BIN" "file://$PWD/dist" Source/tests/sample_track_notes.txt Source/tests/sample_tutor_facts.txt

      - name: AI tutor check (smarter model)
        env:
          MU_TUTOR_DIR: ${{ github.workspace }}/tutor-check/smart
          MU_TUTOR_MODEL: smart
          MU_TUTOR_ARGS: "--device none"
        run: |
          BIN="$(find build -type f -name MUTutorCheck -perm +111 | head -1)"
          "$BIN" "file://$PWD/dist" Source/tests/sample_track_notes.txt Source/tests/sample_tutor_facts.txt Source/tests/tutor_question_one.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MusicallyUnorthodox-mac-installer
          path: dist/*.pkg

      - name: Upload raw bundles
        uses: actions/upload-artifact@v4
        with:
          name: MusicallyUnorthodox-mac-bundles
          path: dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Musically Unorthodox build ${{ github.run_number }}
          body: |
            Download the .pkg, double-click it, click through the installer. Then restart Logic.
            If macOS says it can't be opened: right-click the .pkg > Open > Open.
          make_latest: true
          files: |
            dist/*.pkg
            dist/*.zip
            dist/latest.json
