name: Build macOS plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: brew install cmake ninja || true

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DMU_BUILD_TESTS=ON -DMU_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release --target MusicallyUnorthodox_AU MusicallyUnorthodox_VST3 MusicallyUnorthodox_Standalone MUTests -- -quiet

      - name: DSP tests
        run: ./build/Release/MUTests

      - name: AU validation
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Muxa Muno

      - name: Build installer
        run: bash scripts/make_installer.sh build/MusicallyUnorthodox_artefacts/Release "${GITHUB_RUN_NUMBER}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MusicallyUnorthodox-mac-installer
          path: dist/*.pkg

      - name: Upload raw bundles
        uses: actions/upload-artifact@v4
        with:
          name: MusicallyUnorthodox-mac-bundles
          path: dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Musically Unorthodox build ${{ github.run_number }}
          body: |
            Download the .pkg, double-click it, click through the installer. Then restart Logic.
            If macOS says it can't be opened: right-click the .pkg > Open > Open.
          make_latest: true
          files: |
            dist/*.pkg
            dist/*.zip
            dist/latest.json
