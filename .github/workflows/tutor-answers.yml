name: Tutor answers check

# Asks the built-in AI tutor every question in Source/tests/tutor_questions.txt, with the real helper and real
# models, so the tutor's notes and the choice of model can be judged by reading real answers.
# Does not build or publish the plugin. Runs when the branch "tutor-tuning" is pushed, or by hand.
on:
  push:
    branches: [ tutor-tuning ]
  workflow_dispatch:

jobs:
  ask:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: llama32
            name: "Llama 3.2 3B"
            url: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf
          - id: qwen35
            name: "Qwen3.5 4B"
            url: https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf
          - id: phi4mini
            name: "Phi-4 mini"
            url: https://huggingface.co/bartowski/microsoft_Phi-4-mini-instruct-GGUF/resolve/main/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: brew install cmake ninja || true

      - name: Build the check tool
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMU_BUILD_TESTS=ON
          cmake --build build --target MUTutorCheck

      - name: Keep the model between runs
        uses: actions/cache@v4
        with:
          path: models
          key: eval-model-${{ matrix.id }}-v1

      - name: Fetch the model and the published helper
        run: |
          mkdir -p models feed
          [ -f "models/${{ matrix.id }}.gguf" ] || curl -fL --retry 3 -o "models/${{ matrix.id }}.gguf" "${{ matrix.url }}"
          curl -fsSL -o feed/MusicallyUnorthodox-tutor-macos.zip https://github.com/YbwSolo/musically-unorthodox/releases/latest/download/MusicallyUnorthodox-tutor-macos.zip
          MODEL="$PWD/models/${{ matrix.id }}.gguf" NAME="${{ matrix.name }}" python3 - <<'PY'
          import hashlib, json, os
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()
          model = os.environ["MODEL"]
          pack = "feed/MusicallyUnorthodox-tutor-macos.zip"
          feed = {"build": 1, "tutor": {"version": "eval", "file": os.path.basename(pack), "sha256": sha(pack),
                  "model": {"name": os.environ["NAME"], "url": "file://" + model, "sha256": sha(model), "bytes": os.path.getsize(model)}}}
          json.dump(feed, open("feed/latest.json", "w"))
          print("MODEL", os.environ["NAME"], "sha256", feed["tutor"]["model"]["sha256"], "bytes", feed["tutor"]["model"]["bytes"])
          PY

      - name: Ask the tutor
        env:
          MU_TUTOR_DIR: ${{ github.workspace }}/tutor-${{ matrix.id }}
          MU_TUTOR_ARGS: "--device none"
        run: |
          BIN="$(find build -type f -name MUTutorCheck -perm +111 | head -1)"
          "$BIN" "file://$PWD/feed" Source/tests/sample_track_notes.txt Source/tests/tutor_questions.txt
